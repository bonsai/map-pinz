<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>map-pinz</title>
<style>
html,body{margin:0;height:100%;background:#0b0d10;color:#eee;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{padding:14px 18px;border-bottom:1px solid #252932;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}.hint{opacity:.65;font-size:13px}
input{flex:1;min-width:280px;background:#14171c;color:#fff;border:1px solid #343944;border-radius:7px;padding:9px}
button{background:#20252d;color:#fff;border:1px solid #3b424d;border-radius:7px;padding:9px 13px;cursor:pointer}
main{display:grid;grid-template-columns:1fr 330px;min-height:0;flex:1}
#map{min-height:520px}
aside{border-left:1px solid #252932;padding:16px;overflow:auto}
.item{padding:10px 0;border-bottom:1px solid #252932}.item b{display:block;margin-bottom:4px}
a{color:#8ec5ff}.empty{opacity:.55}
@media(max-width:800px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #252932;max-height:40vh}}
</style>
</head>
<body>
<header>
<h1>map-pinz</h1>
<span class="hint">JSONL → pins</span>
<input id="url" placeholder="JSONL URL /data/example.jsonl">
<button id="load">Load</button>
</header>
<main><div id="map"></div><aside id="list"><div class="empty">JSONLを指定してください</div></aside></main>
<script type="module">
import Globe from "https://cdn.jsdelivr.net/npm/three-globe@2.45.0/+esm";
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

const root=document.querySelector("#map"), list=document.querySelector("#list");
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b0d10);
const camera=new THREE.PerspectiveCamera(45,1,0.1,2000); camera.position.z=260;
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio); root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
const globe=new Globe().globeImageUrl("https://unpkg.com/three-globe/example/img/earth-night.jpg").bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png");
scene.add(globe);

function resize(){const w=root.clientWidth,h=root.clientHeight||600;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()} addEventListener("resize",resize); resize();
(function tick(){controls.update();renderer.render(scene,camera);requestAnimationFrame(tick)})();

function rows(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>JSON.parse(x))}
function coord(o){const lat=Number(o.lat??o.latitude??o.location?.lat??o.location?.latitude),lng=Number(o.lon??o.lng??o.longitude??o.location?.lon??o.location?.lng??o.location?.longitude);return Number.isFinite(lat)&&Number.isFinite(lng)?{lat,lng}:null}
function render(data){
 const pins=data.map((o,i)=>{const c=coord(o);return c?{...o,...c}:null}).filter(Boolean);
 globe.pointsData(pins).pointLat("lat").pointLng("lng").pointAltitude(.018).pointRadius(.34).pointColor(()=>"#ffcc66");
 list.innerHTML=pins.length?pins.map((o,i)=>'<div class="item"><b>'+esc(o.name??o.title??o.id??("pin "+(i+1)))+'</b><span>'+esc(o.type??"")+'</span><br><small>'+o.lat.toFixed(5)+", "+o.lng.toFixed(5)+'</small>'+(o.url||o.official_url?'<br><a target="_blank" rel="noopener" href="'+esc(o.url??o.official_url)+'">source</a>':"")+'</div>').join(""):'<div class="empty">緯度・経度を持つレコードがありません</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
async function load(url){const res=await fetch(url);if(!res.ok)throw Error(res.status+" "+res.statusText);render(rows(await res.text()))}
document.querySelector("#load").onclick=()=>{const u=document.querySelector("#url").value.trim();if(u)load(u).catch(e=>list.innerHTML='<div class="empty">Load error: '+esc(e.message)+'</div>')};
const p=new URLSearchParams(location.search); const u=p.getAll("jsonl").concat(p.getAll("data"))[0]; if(u){document.querySelector("#url").value=u;load(u).catch(e=>list.innerHTML='<div class="empty">Load error: '+esc(e.message)+'</div>')}
</script>
</body>
</html>
